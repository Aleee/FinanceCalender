name: macos-build

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.2 pillow==12.3.0
      - run: python tools/build_release_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceCalender-mac
          path: dist/release/*

name: macos-build

on:
  workflow_dispatch:
    inputs:
      intel:
        description: Собрать также версию для Mac Intel
        type: boolean
        default: false
      notes:
        description: Текст «Что нового»
        type: string
        default: ''

jobs:
  build-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.2 pillow==12.3.0
      - run: python tools/build_release_mac.py --notes "$NOTES"
        env:
          NOTES: ${{ inputs.notes }}
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceCalender-mac-arm64
          path: dist/release/*

  build-x86_64:
    if: ${{ inputs.intel }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.2 pillow==12.3.0
      - run: python tools/build_release_mac.py --notes "$NOTES"
        env:
          NOTES: ${{ inputs.notes }}
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceCalender-mac-x86_64
          path: dist/release/*

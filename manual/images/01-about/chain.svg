<svg xmlns="http://www.w3.org/2000/svg" width="870" height="345" viewBox="0 0 870 345" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="870" height="345" fill="#ffffff"/>

  <text x="20" y="26" font-size="14" font-weight="600" fill="#555">Справочник (необязательная часть)</text>
  <rect x="8" y="36" width="854" height="112" rx="8" fill="#f4f6f9" stroke="#c5d6e8" stroke-dasharray="6 4"/>

  <g font-size="16" fill="#1f3a5f" text-anchor="middle">
    <rect x="20" y="52" width="230" height="84" rx="8" fill="#e8f0f8" stroke="#2c5c8a" stroke-width="1.5"/>
    <text x="135" y="82" font-weight="700">Контрагент</text>
    <text x="135" y="106" font-size="12" fill="#555">ООО «Северсвет»</text>

    <rect x="320" y="52" width="230" height="84" rx="8" fill="#e8f0f8" stroke="#2c5c8a" stroke-width="1.5"/>
    <text x="435" y="82" font-weight="700">Договор</text>
    <text x="435" y="106" font-size="12" fill="#555">№ 12 от 01.03.2026</text>

    <rect x="620" y="52" width="230" height="84" rx="8" fill="#e8f0f8" stroke="#2c5c8a" stroke-width="1.5"/>
    <text x="735" y="82" font-weight="700">Документ</text>
    <text x="735" y="104" font-size="12" fill="#555">счёт, акт, накладная…</text>
    <text x="735" y="121" font-size="12" fill="#555">и условия оплаты</text>
  </g>
  <line x1="250" y1="94" x2="316" y2="94" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="94" x2="616" y2="94" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="283" y="84">несколько</text>
    <text x="583" y="84">несколько</text>
  </g>

  <text x="20" y="190" font-size="14" font-weight="600" fill="#555">Главная таблица</text>
  <g font-size="16" fill="#1f3a5f" text-anchor="middle">
    <rect x="620" y="206" width="230" height="84" rx="8" fill="#fff6dd" stroke="#c9a400" stroke-width="2"/>
    <text x="735" y="236" font-weight="700">Платеж</text>
    <text x="735" y="258" font-size="12" fill="#555">сумма, срок оплаты,</text>
    <text x="735" y="275" font-size="12" fill="#555">категория…</text>

    <rect x="320" y="206" width="230" height="84" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="435" y="236" font-weight="700">Оплата</text>
    <text x="435" y="258" font-size="12" fill="#555">дата и сумма</text>
    <text x="435" y="275" font-size="12" fill="#555">(оплат может быть несколько)</text>
  </g>
  <line x1="620" y1="248" x2="554" y2="248" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="587" y="238" font-size="11" fill="#555" text-anchor="middle">погашается</text>

  <line x1="735" y1="206" x2="735" y2="140" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="747" y="176" font-size="11" fill="#555" text-anchor="start">можно привязать</text>

  <text x="435" y="326" font-size="14" fill="#1f3a5f" text-anchor="middle">Сумма платежа − все оплаты = остаток</text>
</svg>

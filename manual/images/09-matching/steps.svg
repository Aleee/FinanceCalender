<svg xmlns="http://www.w3.org/2000/svg" width="870" height="400" viewBox="0 0 870 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="870" height="400" fill="#ffffff"/>

  <g font-size="15" text-anchor="middle">
    <rect x="20" y="20" width="250" height="70" rx="8" fill="#fbeceb" stroke="#b03a2e" stroke-width="1.5"/>
    <text x="145" y="50" font-weight="700" fill="#b03a2e">Выписка банка</text>
    <text x="145" y="72" font-size="12" fill="#555">списания за период выписки</text>

    <rect x="600" y="20" width="250" height="70" rx="8" fill="#e8f0f8" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="725" y="50" font-weight="700" fill="#1f5fa8">Платежный календарь</text>
    <text x="725" y="72" font-size="12" fill="#555">оплаты с датой в том же периоде</text>
  </g>
  <line x1="145" y1="90" x2="145" y2="125" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="725" y1="90" x2="725" y2="125" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="15" text-anchor="middle" fill="#1f3a5f">
    <rect x="20" y="130" width="830" height="70" rx="8" fill="#f4f6f9" stroke="#2c5c8a" stroke-width="1.5"/>
    <text x="435" y="158" font-weight="700">Шаг 1. Для каждой даты ищутся суммы, которые есть и там и там</text>
    <text x="435" y="182" font-size="12" fill="#555">совпали день и сумма до копейки — пара из сверки убирается</text>
  </g>
  <line x1="435" y1="200" x2="435" y2="225" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="15" text-anchor="middle" fill="#1f3a5f">
    <rect x="20" y="230" width="830" height="70" rx="8" fill="#fffbea" stroke="#b8a54a" stroke-width="1.5"/>
    <text x="435" y="258" font-weight="700">Шаг 2. Среди оставшегося ищутся вероятные пары и группы</text>
    <text x="435" y="282" font-size="12" fill="#555">суммы близки (разница до 15%) и похожи получатель или назначение; налоги по договорам подряда</text>
  </g>
  <line x1="435" y1="300" x2="435" y2="325" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="15" text-anchor="middle" fill="#1f3a5f">
    <rect x="20" y="330" width="400" height="56" rx="8" fill="#fbeceb" stroke="#b03a2e" stroke-width="1.5"/>
    <text x="220" y="354" font-weight="700" fill="#b03a2e">Только в выписке</text>
    <text x="220" y="374" font-size="12" fill="#555">денег ушло, а в календаре оплаты нет</text>

    <rect x="450" y="330" width="400" height="56" rx="8" fill="#e8f0f8" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="650" y="354" font-weight="700" fill="#1f5fa8">Только в календаре</text>
    <text x="650" y="374" font-size="12" fill="#555">оплата внесена, а в выписке списания нет</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="870" height="400" viewBox="0 0 870 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="870" height="400" fill="#ffffff"/>

  <g font-size="15" text-anchor="middle">
    <rect x="20" y="20" width="380" height="110" rx="8" fill="#f4f6f9" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="210" y="50" font-weight="700" fill="#555">Дома, без сети</text>
    <text x="210" y="76" font-size="12" fill="#555">вы вносите и меняете платежи и оплаты</text>
    <text x="210" y="96" font-size="12" fill="#555">кнопка: «нет связи» или «есть неотправленные» —</text>
    <text x="210" y="114" font-size="12" fill="#555">это нормально</text>

    <rect x="470" y="20" width="380" height="110" rx="8" fill="#e8f0f8" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="660" y="50" font-weight="700" fill="#1f5fa8">В офисе, сеть есть</text>
    <text x="660" y="76" font-size="12" fill="#555">при запуске программа сверяет</text>
    <text x="660" y="96" font-size="12" fill="#555">вашу локальную копию с общей базой</text>
  </g>
  <line x1="402" y1="75" x2="468" y2="75" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="660" y1="132" x2="660" y2="170" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="210" y1="170" x2="710" y2="170" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="210" y1="170" x2="210" y2="205" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="170" x2="460" y2="205" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="170" x2="710" y2="205" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="13" text-anchor="middle" fill="#1f3a5f">
    <text x="210" y="190" font-size="12" fill="#555">коллега ничего не менял</text>
    <text x="460" y="190" font-size="12" fill="#555">коллега менял платежи и оплаты</text>
    <text x="710" y="190" font-size="12" fill="#555">менялись те же поля или справочники</text>

    <rect x="20" y="210" width="380" height="0" fill="none"/>
    <rect x="90" y="210" width="240" height="120" rx="8" fill="#e8f0f8" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="210" y="240" font-weight="700" fill="#1f5fa8">Отправка</text>
    <text x="210" y="265" font-size="12" fill="#555">ваши изменения</text>
    <text x="210" y="283" font-size="12" fill="#555">уходят в общую базу</text>

    <rect x="340" y="210" width="240" height="120" rx="8" fill="#fffbea" stroke="#b8a54a" stroke-width="1.5"/>
    <text x="460" y="240" font-weight="700" fill="#7a6a1c">Автообъединение</text>
    <text x="460" y="265" font-size="12" fill="#555">правки соединяются,</text>
    <text x="460" y="283" font-size="12" fill="#555">результат отправляется;</text>
    <text x="460" y="301" font-size="12" fill="#555">проверьте дубли</text>

    <rect x="590" y="210" width="240" height="120" rx="8" fill="#fdf1e3" stroke="#b26a00" stroke-width="1.5"/>
    <text x="710" y="240" font-weight="700" fill="#b26a00">Конфликт</text>
    <text x="710" y="265" font-size="12" fill="#555">нужно выбрать, чья версия</text>
    <text x="710" y="283" font-size="12" fill="#555">остаётся; ваша версия</text>
    <text x="710" y="301" font-size="12" fill="#555">сохраняется в копии</text>
  </g>
</svg>

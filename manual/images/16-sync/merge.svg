<svg xmlns="http://www.w3.org/2000/svg" width="870" height="440" viewBox="0 0 870 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="870" height="440" fill="#ffffff"/>

  <g font-size="15" text-anchor="middle">
    <rect x="20" y="165" width="190" height="100" rx="8" fill="#f4f6f9" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="115" y="204" font-weight="700" fill="#1f3a5f">Последняя</text>
    <text x="115" y="224" font-weight="700" fill="#1f3a5f">синхронизация</text>
    <text x="115" y="246" font-size="12" fill="#555">общая отправная точка</text>

    <rect x="290" y="25" width="260" height="100" rx="8" fill="#e8f0f8" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="420" y="58" font-weight="700" fill="#1f5fa8">Ваши изменения</text>
    <text x="420" y="78" font-size="12" fill="#555">платежи, оплаты, контрагенты, договоры,</text>
    <text x="420" y="94" font-size="12" fill="#555">документы, финплан и его исполнение:</text>
    <text x="420" y="110" font-size="12" fill="#555">добавили, изменили, удалили</text>

    <rect x="290" y="305" width="260" height="100" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="420" y="338" font-weight="700" fill="#2e7d32">Изменения коллеги</text>
    <text x="420" y="362" font-size="12" fill="#555">любые, уже отправлены</text>
    <text x="420" y="380" font-size="12" fill="#555">в общую базу</text>

    <rect x="630" y="165" width="220" height="100" rx="8" fill="#fffbea" stroke="#b8a54a" stroke-width="1.5"/>
    <text x="740" y="198" font-weight="700" fill="#7a6a1c">Объединение</text>
    <text x="740" y="222" font-size="12" fill="#555">ваши изменения переносятся</text>
    <text x="740" y="240" font-size="12" fill="#555">на общую базу коллеги</text>
  </g>

  <line x1="165" y1="163" x2="288" y2="105" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="165" y1="267" x2="288" y2="325" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="552" y1="105" x2="676" y2="163" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="552" y1="325" x2="676" y2="267" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="740" y1="267" x2="740" y2="300" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="13" text-anchor="middle" fill="#1f3a5f">
    <rect x="630" y="305" width="220" height="100" rx="8" fill="#f4f6f9" stroke="#2c5c8a" stroke-width="1.5"/>
    <text x="740" y="335" font-weight="700">Результат</text>
    <text x="740" y="358" font-size="12" fill="#555">заменяет вашу локальную копию</text>
    <text x="740" y="376" font-size="12" fill="#555">и уходит в общую базу.</text>
    <text x="740" y="394" font-size="12" fill="#555">Ваша версия — в conflict_….db</text>
  </g>
</svg>
